app = "sportsbetting-bot"
primary_region = "iad"  # US East (Ashburn) — closest to Kalshi

[build]

[env]
  RUST_LOG = "sports_betting=info"

# Dashboard HTTP service on port 3030
[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
